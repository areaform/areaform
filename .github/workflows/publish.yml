name: Publish

# Publishes the packages to npm when a version tag is pushed: `v0.2.0` on main as `latest`,
# `v0.2.0-next.1` on next as `next`. npm trusts this workflow (Trusted Publishing): no npm token is
# stored anywhere, and every package gets provenance, a signed record of the commit it was built
# from. Only the `npm` environment may publish, and it takes only `v*` tags.

on:
    push:
        tags: ['v*']

permissions:
    contents: read

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            # The OIDC token npm checks instead of a password.
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            # Trusted Publishing needs npm 11.5.1 or newer.
            - run: |
                  node -e 'const [a, b, c] = process.argv[1].split(".").map(Number);
                      process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm -v)" ||
                      npm install --global npm@11
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter "./packages/*" build
            - name: Publish what npm has not got yet
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  # The tag names the version of the packages released together (core and the rest);
                  # the MCP server has versions of its own and goes when its version is new.
                  core="$(node -p 'require("./packages/core/package.json").version')"
                  [ "$TAG" = "v$core" ] || { echo "The tag $TAG is not v$core, the packages' version" >&2; exit 1; }
                  case "$core" in *-*) dist=next ;; *) dist=latest ;; esac
                  mkdir -p "$RUNNER_TEMP/packs"
                  for dir in packages/*/; do
                      name="$(node -p "require('./${dir}package.json').name")"
                      version="$(node -p "require('./${dir}package.json').version")"
                      if [ "$(node -p "require('./${dir}package.json').private === true")" = true ]; then continue; fi
                      if npm view "$name@$version" version >/dev/null 2>&1; then
                          echo "$name@$version is on npm already"
                          continue
                      fi
                      # pnpm packs: it applies publishConfig and turns workspace:* into versions.
                      # npm publishes: it speaks Trusted Publishing.
                      tarball="$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs" | tail -1)"
                      npm publish "$tarball" --access public --provenance --tag "$dist"
                      echo "Published $name@$version as $dist" | tee -a "$GITHUB_STEP_SUMMARY"
                  done
